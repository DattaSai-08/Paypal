<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Innkeeper front desk</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><h1 id="prop-name">Innkeeper</h1><span id="prop-tagline"></span></div>
    <nav class="nav"><a href="/" class="active">Front desk</a><a href="/traveler">Traveller's agent</a><a href="/owner">Owner</a></nav>
  </header>
  <div class="layout">
    <aside class="side">
      <h2>Rooms and rates</h2>
      <p class="lead small" id="prop-desc"></p>
      <ul class="rooms" id="rooms"></ul>
      <div class="policy" id="policy"></div>
      <p class="small muted" style="margin-top:14px" id="mode-line"></p>
    </aside>
    <section class="chat">
      <div class="messages" id="messages"></div>
      <div class="chips" id="chips"></div>
      <form class="composer" id="composer">
        <input id="input" autocomplete="off" placeholder="Ask about dates, rooms, a discount, a pickup…" aria-label="Message the front desk">
        <button class="primary" type="submit" id="send">Send</button>
      </form>
      <div class="loop" id="loop">
        <div data-step="hold"><b>Room held</b>30-minute hold</div>
        <div data-step="deposit"><b>Deposit paid</b>PayPal checkout</div>
        <div data-step="confirmed"><b>Confirmed</b>capture received</div>
        <div data-step="balance"><b>Balance</b>auto-collected 7 days before</div>
        <div data-step="payout"><b>Partners paid</b>PayPal Payouts</div>
      </div>
    </section>
  </div>
  <script src="/session.js"></script>
  <script src="/guest.js"></script>
</body>
</html>
